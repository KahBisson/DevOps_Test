name: CI-Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verificacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar HTML
        run: |
          echo "Validando estrutura..."
          grep -q "<html>" index.html
          echo "Tudo certo!"
